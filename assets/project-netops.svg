<svg width="900" height="214" viewBox="0 0 900 214" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NetOps Sentinel. A network lab built from scratch: two routers and two hosts under Prometheus monitoring. When something breaks, an app opens an incident, collects evidence and asks an AI model for its view, and a human decides." xmlns:c2pa="http://c2pa.org/manifest">
  <title>NetOps Sentinel</title>
  <style>
    :root { --fg:#e6edf3; --body:#c9d1d9; --mute:#8b949e; --rule:#30363d; --accent:#e3a857; }
    @media (prefers-color-scheme: light) {
      :root { --fg:#1f2328; --body:#3d444d; --mute:#59636e; --rule:#d0d7de; --accent:#9a6700; }
    }
    .sans { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif; }
    .mono { font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; }
    .hair  { stroke:var(--rule); stroke-width:1; }
    .sweep { stroke:var(--accent); stroke-width:1.5; opacity:0; animation:sweep 7s cubic-bezier(.4,0,.2,1) 0s infinite; }
    .label { font-size:13px; fill:var(--mute); }
    .name  { font-size:24px; font-weight:600; letter-spacing:-.5px; fill:var(--fg); }
    .repo  { font-size:12px; fill:var(--mute); }
    .desc  { font-size:15px; fill:var(--body); }
    @keyframes sweep {
      0% { transform:translateX(0); opacity:0 }
      8% { opacity:1 }
      60% { transform:translateX(700px); opacity:1 }
      68%, 100% { transform:translateX(700px); opacity:0 }
    }
    .rail { stroke:var(--rule); stroke-width:1; }
    .node { fill:transparent; stroke:var(--rule); stroke-width:1.5; }
    .tick { font-size:11px; fill:var(--mute); }
    .dotc { fill:var(--accent); opacity:0; animation:hop 10s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes hop {
      0% { transform:translateX(0); opacity:0 }
      2% { transform:translateX(0); opacity:1 }
      4%, 10% { transform:translateX(0px); opacity:1 }
      22%, 28% { transform:translateX(195px); opacity:1 }
      40%, 46% { transform:translateX(390px); opacity:1 }
      58%, 64% { transform:translateX(585px); opacity:1 }
      76%, 92% { transform:translateX(780px); opacity:1 }
      96% { transform:translateX(780px); opacity:0 }
      100% { transform:translateX(0); opacity:0 }
    }
    .n0 { animation:n0 10s linear infinite; }
    .l0 { animation:l0 10s linear infinite; }
    @keyframes n0 { 0%, 3% { fill:transparent; stroke:var(--rule) } 5%, 94% { fill:var(--accent); stroke:var(--accent) } 98%, 100% { fill:transparent; stroke:var(--rule) } }
    @keyframes l0 { 0%, 3% { fill:var(--mute) } 5%, 94% { fill:var(--fg) } 98%, 100% { fill:var(--mute) } }
    .n1 { animation:n1 10s linear infinite; }
    .l1 { animation:l1 10s linear infinite; }
    @keyframes n1 { 0%, 21% { fill:transparent; stroke:var(--rule) } 23%, 94% { fill:var(--accent); stroke:var(--accent) } 98%, 100% { fill:transparent; stroke:var(--rule) } }
    @keyframes l1 { 0%, 21% { fill:var(--mute) } 23%, 94% { fill:var(--fg) } 98%, 100% { fill:var(--mute) } }
    .n2 { animation:n2 10s linear infinite; }
    .l2 { animation:l2 10s linear infinite; }
    @keyframes n2 { 0%, 39% { fill:transparent; stroke:var(--rule) } 41%, 94% { fill:var(--accent); stroke:var(--accent) } 98%, 100% { fill:transparent; stroke:var(--rule) } }
    @keyframes l2 { 0%, 39% { fill:var(--mute) } 41%, 94% { fill:var(--fg) } 98%, 100% { fill:var(--mute) } }
    .n3 { animation:n3 10s linear infinite; }
    .l3 { animation:l3 10s linear infinite; }
    @keyframes n3 { 0%, 57% { fill:transparent; stroke:var(--rule) } 59%, 94% { fill:var(--accent); stroke:var(--accent) } 98%, 100% { fill:transparent; stroke:var(--rule) } }
    @keyframes l3 { 0%, 57% { fill:var(--mute) } 59%, 94% { fill:var(--fg) } 98%, 100% { fill:var(--mute) } }
    .n4 { animation:n4 10s linear infinite; }
    .l4 { animation:l4 10s linear infinite; }
    @keyframes n4 { 0%, 75% { fill:transparent; stroke:var(--rule) } 77%, 94% { fill:var(--accent); stroke:var(--accent) } 98%, 100% { fill:transparent; stroke:var(--rule) } }
    @keyframes l4 { 0%, 75% { fill:var(--mute) } 77%, 94% { fill:var(--fg) } 98%, 100% { fill:var(--mute) } }
    @media (prefers-reduced-motion: reduce) {
      .sweep, .dotc { animation:none; opacity:0 }
      .node { animation:none !important; fill:var(--accent) !important; stroke:var(--accent) !important }
      .tick { animation:none !important; fill:var(--fg) !important }
    }
  </style>
  <line class="hair" x1="60" y1="0.5" x2="840" y2="0.5"/>
  <line class="sweep" x1="60" y1="0.5" x2="140" y2="0.5"/>
  <text class="sans label" x="60" y="44">Biggest project so far</text>
  <text class="sans name" x="60" y="82">NetOps Sentinel</text>
  <text class="mono repo" x="60" y="110">mihai-minascurta/NetOps-Sentinel</text>
  <text class="sans desc" x="470" y="52">A network lab built from scratch: two routers,</text>
  <text class="sans desc" x="470" y="76">two hosts under Prometheus. When something</text>
  <text class="sans desc" x="470" y="100">breaks, an app opens an incident, collects</text>
  <text class="sans desc" x="470" y="124">evidence and asks an AI model for its view.</text>
  <line class="rail" x1="60" y1="170" x2="840" y2="170"/>
  <circle class="node n0" cx="60" cy="170" r="5"/>
  <text class="mono tick l0" x="60" y="194" text-anchor="start">alert</text>
  <circle class="node n1" cx="255" cy="170" r="5"/>
  <text class="mono tick l1" x="255" y="194" text-anchor="middle">incident</text>
  <circle class="node n2" cx="450" cy="170" r="5"/>
  <text class="mono tick l2" x="450" y="194" text-anchor="middle">evidence</text>
  <circle class="node n3" cx="645" cy="170" r="5"/>
  <text class="mono tick l3" x="645" y="194" text-anchor="middle">likely cause</text>
  <circle class="node n4" cx="840" cy="170" r="5"/>
  <text class="mono tick l4" x="840" y="194" text-anchor="end">human decides</text>
  <circle class="dotc" cx="60" cy="170" r="3.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
