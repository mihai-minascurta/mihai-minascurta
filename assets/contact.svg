<svg width="900" height="132" viewBox="0 0 900 132" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Say hello. A small ping animation: a packet travels from you to me and a reply comes back." xmlns:c2pa="http://c2pa.org/manifest">
  <title>Say hello</title>
  <style>
    :root { --fg:#e6edf3; --body:#c9d1d9; --mute:#8b949e; --rule:#30363d; --accent:#e3a857; }
    @media (prefers-color-scheme: light) {
      :root { --fg:#1f2328; --body:#3d444d; --mute:#59636e; --rule:#d0d7de; --accent:#9a6700; }
    }
    .sans { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif; }
    .mono { font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; }
    .hair  { stroke:var(--rule); stroke-width:1; }
    .sweep { stroke:var(--accent); stroke-width:1.5; opacity:0; animation:sweep 7s cubic-bezier(.4,0,.2,1) 6s infinite; }
    .label { font-size:13px; fill:var(--mute); }
    .name  { font-size:24px; font-weight:600; letter-spacing:-.5px; fill:var(--fg); }
    .repo  { font-size:12px; fill:var(--mute); }
    .desc  { font-size:15px; fill:var(--body); }
    @keyframes sweep {
      0% { transform:translateX(0); opacity:0 }
      8% { opacity:1 }
      60% { transform:translateX(700px); opacity:1 }
      68%, 100% { transform:translateX(700px); opacity:0 }
    }
    .rail { stroke:var(--rule); stroke-width:1; }
    .node { fill:transparent; stroke:var(--rule); stroke-width:1.5; }
    .tick { font-size:11px; fill:var(--mute); }
    .cap  { font-size:12px; fill:var(--mute); }
    .req  { fill:var(--accent); opacity:0; animation:req 5s cubic-bezier(.4,0,.2,1) infinite; }
    .rep  { fill:var(--fg); opacity:0; animation:rep 5s cubic-bezier(.4,0,.2,1) infinite; }
    .ring { fill:none; stroke:var(--accent); stroke-width:1.5; opacity:0; transform-box:fill-box; transform-origin:center; animation:ring 5s ease-out infinite; }
    .nl   { animation:nl 5s linear infinite; }
    .nr   { animation:nr 5s linear infinite; }
    .c1   { opacity:1; animation:c1 5s linear infinite; }
    .c2   { opacity:0; animation:c2 5s linear infinite; }
    @keyframes req { 0% { transform:translateX(0); opacity:0 } 4% { transform:translateX(0); opacity:1 } 40% { transform:translateX(360px); opacity:1 } 42%, 100% { transform:translateX(360px); opacity:0 } }
    @keyframes rep { 0%, 50% { transform:translateX(0); opacity:0 } 52% { transform:translateX(0); opacity:1 } 90% { transform:translateX(-360px); opacity:1 } 92%, 100% { transform:translateX(-360px); opacity:0 } }
    @keyframes ring { 0%, 39% { transform:scale(1); opacity:0 } 40% { transform:scale(1); opacity:.8 } 58% { transform:scale(3.6); opacity:0 } 100% { transform:scale(3.6); opacity:0 } }
    @keyframes nr { 0%, 38% { fill:transparent; stroke:var(--rule) } 42%, 70% { fill:var(--accent); stroke:var(--accent) } 80%, 100% { fill:transparent; stroke:var(--rule) } }
    @keyframes nl { 0%, 88% { fill:transparent; stroke:var(--rule) } 92%, 98% { fill:var(--fg); stroke:var(--fg) } 100% { fill:transparent; stroke:var(--rule) } }
    @keyframes c1 { 0% { opacity:0 } 3%, 42% { opacity:1 } 46%, 100% { opacity:0 } }
    @keyframes c2 { 0%, 50% { opacity:0 } 54%, 90% { opacity:1 } 94%, 100% { opacity:0 } }
    @media (prefers-reduced-motion: reduce) {
      .sweep, .req, .rep, .ring { animation:none; opacity:0 }
      .nl, .nr, .c1, .c2 { animation:none !important }
      .c1 { opacity:1 !important } .c2 { opacity:0 !important }
    }
  </style>
  <line class="hair" x1="60" y1="0.5" x2="840" y2="0.5"/>
  <line class="sweep" x1="60" y1="0.5" x2="140" y2="0.5"/>
  <text class="sans label" x="60" y="44">Contact</text>
  <text class="sans name" x="60" y="82">Say hello</text>
  <text class="mono repo" x="60" y="110">$ ping mihai</text>
  <line class="rail" x1="480" y1="74" x2="840" y2="74"/>
  <circle class="node nl" cx="480" cy="74" r="5"/>
  <circle class="node nr" cx="840" cy="74" r="5"/>
  <circle class="ring" cx="840" cy="74" r="5"/>
  <text class="mono tick" x="480" y="100">you</text>
  <text class="mono tick" x="840" y="100" text-anchor="end">me</text>
  <text class="mono cap c1" x="660" y="58" text-anchor="middle">ping</text>
  <text class="mono cap c2" x="660" y="58" text-anchor="middle">reply</text>
  <circle class="req" cx="480" cy="74" r="3.5"/>
  <circle class="rep" cx="840" cy="74" r="3.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
