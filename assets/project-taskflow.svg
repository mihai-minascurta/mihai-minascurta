<svg width="900" height="214" viewBox="0 0 900 214" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Taskflow. A team task manager in React, Flask and PostgreSQL, handed over as plain source code. I built what comes after: a GitHub Actions pipeline, Terraform and a Kubernetes setup." xmlns:c2pa="http://c2pa.org/manifest">
  <title>Taskflow</title>
  <style>
    :root { --fg:#e6edf3; --body:#c9d1d9; --mute:#8b949e; --rule:#30363d; --accent:#e3a857; }
    @media (prefers-color-scheme: light) {
      :root { --fg:#1f2328; --body:#3d444d; --mute:#59636e; --rule:#d0d7de; --accent:#9a6700; }
    }
    .sans { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif; }
    .mono { font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; }
    .hair  { stroke:var(--rule); stroke-width:1; }
    .sweep { stroke:var(--accent); stroke-width:1.5; opacity:0; animation:sweep 7s cubic-bezier(.4,0,.2,1) 1.5s infinite; }
    .label { font-size:13px; fill:var(--mute); }
    .name  { font-size:24px; font-weight:600; letter-spacing:-.5px; fill:var(--fg); }
    .repo  { font-size:12px; fill:var(--mute); }
    .desc  { font-size:15px; fill:var(--body); }
    @keyframes sweep {
      0% { transform:translateX(0); opacity:0 }
      8% { opacity:1 }
      60% { transform:translateX(700px); opacity:1 }
      68%, 100% { transform:translateX(700px); opacity:0 }
    }
    .rail { stroke:var(--rule); stroke-width:1; }
    .node { fill:transparent; stroke:var(--rule); stroke-width:1.5; }
    .tick { font-size:11px; fill:var(--mute); }
    .dotc { fill:var(--accent); opacity:0; animation:hop 9s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes hop {
      0% { transform:translateX(0); opacity:0 }
      2% { transform:translateX(0); opacity:1 }
      4%, 10% { transform:translateX(0px); opacity:1 }
      26%, 32% { transform:translateX(260px); opacity:1 }
      48%, 54% { transform:translateX(520px); opacity:1 }
      70%, 92% { transform:translateX(780px); opacity:1 }
      96% { transform:translateX(780px); opacity:0 }
      100% { transform:translateX(0); opacity:0 }
    }
    .n0 { animation:n0 9s linear infinite; }
    .l0 { animation:l0 9s linear infinite; }
    @keyframes n0 { 0%, 3% { fill:transparent; stroke:var(--rule) } 5%, 94% { fill:var(--accent); stroke:var(--accent) } 98%, 100% { fill:transparent; stroke:var(--rule) } }
    @keyframes l0 { 0%, 3% { fill:var(--mute) } 5%, 94% { fill:var(--fg) } 98%, 100% { fill:var(--mute) } }
    .n1 { animation:n1 9s linear infinite; }
    .l1 { animation:l1 9s linear infinite; }
    @keyframes n1 { 0%, 25% { fill:transparent; stroke:var(--rule) } 27%, 94% { fill:var(--accent); stroke:var(--accent) } 98%, 100% { fill:transparent; stroke:var(--rule) } }
    @keyframes l1 { 0%, 25% { fill:var(--mute) } 27%, 94% { fill:var(--fg) } 98%, 100% { fill:var(--mute) } }
    .n2 { animation:n2 9s linear infinite; }
    .l2 { animation:l2 9s linear infinite; }
    @keyframes n2 { 0%, 47% { fill:transparent; stroke:var(--rule) } 49%, 94% { fill:var(--accent); stroke:var(--accent) } 98%, 100% { fill:transparent; stroke:var(--rule) } }
    @keyframes l2 { 0%, 47% { fill:var(--mute) } 49%, 94% { fill:var(--fg) } 98%, 100% { fill:var(--mute) } }
    .n3 { animation:n3 9s linear infinite; }
    .l3 { animation:l3 9s linear infinite; }
    @keyframes n3 { 0%, 69% { fill:transparent; stroke:var(--rule) } 71%, 94% { fill:var(--accent); stroke:var(--accent) } 98%, 100% { fill:transparent; stroke:var(--rule) } }
    @keyframes l3 { 0%, 69% { fill:var(--mute) } 71%, 94% { fill:var(--fg) } 98%, 100% { fill:var(--mute) } }
    @media (prefers-reduced-motion: reduce) {
      .sweep, .dotc { animation:none; opacity:0 }
      .node { animation:none !important; fill:var(--accent) !important; stroke:var(--accent) !important }
      .tick { animation:none !important; fill:var(--fg) !important }
    }
  </style>
  <line class="hair" x1="60" y1="0.5" x2="840" y2="0.5"/>
  <line class="sweep" x1="60" y1="0.5" x2="140" y2="0.5"/>
  <text class="sans label" x="60" y="44">From dev to DevOps</text>
  <text class="sans name" x="60" y="82">Taskflow</text>
  <text class="mono repo" x="60" y="110">mihai-minascurta/taskflow</text>
  <text class="sans desc" x="470" y="52">A team task manager in React, Flask and</text>
  <text class="sans desc" x="470" y="76">PostgreSQL, handed over as plain source code.</text>
  <text class="sans desc" x="470" y="100">I built what comes after: a GitHub Actions</text>
  <text class="sans desc" x="470" y="124">pipeline, Terraform and a Kubernetes setup.</text>
  <line class="rail" x1="60" y1="170" x2="840" y2="170"/>
  <circle class="node n0" cx="60" cy="170" r="5"/>
  <text class="mono tick l0" x="60" y="194" text-anchor="start">git push</text>
  <circle class="node n1" cx="320" cy="170" r="5"/>
  <text class="mono tick l1" x="320" y="194" text-anchor="middle">GitHub Actions</text>
  <circle class="node n2" cx="580" cy="170" r="5"/>
  <text class="mono tick l2" x="580" y="194" text-anchor="middle">Terraform</text>
  <circle class="node n3" cx="840" cy="170" r="5"/>
  <text class="mono tick l3" x="840" y="194" text-anchor="end">Kubernetes</text>
  <circle class="dotc" cx="60" cy="170" r="3.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
