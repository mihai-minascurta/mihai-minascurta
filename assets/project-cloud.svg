<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Audit Notes Service: EKS. The same app, moved to AWS. Terraform builds the VPC, the EKS cluster, IAM, the ALB controller and the EBS CSI driver, one apply at a time.">
  <title>Audit Notes Service: EKS</title>
  <style>
    :root { --fg:#e6edf3; --body:#c9d1d9; --mute:#8b949e; --rule:#30363d; --accent:#e3a857; }
    @media (prefers-color-scheme: light) {
      :root { --fg:#1f2328; --body:#3d444d; --mute:#59636e; --rule:#d0d7de; --accent:#9a6700; }
    }
    .sans { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif; }
    .mono { font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; }
    .hair  { stroke:var(--rule); stroke-width:1; }
    .sweep { stroke:var(--accent); stroke-width:1.5; opacity:0; animation:sweep 7s cubic-bezier(.4,0,.2,1) 2s infinite; }
    .label { font-size:13px; fill:var(--mute); }
    .name  { font-size:24px; font-weight:600; letter-spacing:-.5px; fill:var(--fg); }
    .repo  { font-size:12px; fill:var(--mute); }
    .desc  { font-size:15px; fill:var(--body); }
    @keyframes sweep {
      0% { transform:translateX(0); opacity:0 }
      8% { opacity:1 }
      60% { transform:translateX(700px); opacity:1 }
      68%, 100% { transform:translateX(700px); opacity:0 }
    }
    @media (prefers-reduced-motion: reduce) { .sweep { animation:none; opacity:0 } }
  </style>
  <line class="hair" x1="60" y1="0.5" x2="840" y2="0.5"/>
  <line class="sweep" x1="60" y1="0.5" x2="140" y2="0.5"/>
  <text class="sans label" x="60" y="44">Chapter 2, cloud</text>
  <text class="sans name" x="60" y="82">Audit Notes Service: EKS</text>
  <text class="mono repo" x="60" y="110">mihai-minascurta/audit-notes-service-eks</text>
  <text class="sans desc" x="470" y="52">The same app, moved to AWS. Terraform builds the</text>
  <text class="sans desc" x="470" y="76">VPC, the EKS cluster, IAM, the ALB controller</text>
  <text class="sans desc" x="470" y="100">and the EBS CSI driver, one apply at a time.</text>
</svg>
